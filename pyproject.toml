[project]
name = "pico"
version = "0.1.0"
description = "An agentic harness for local and smaller language models"
readme = "README.md"
authors = [
    { name = "Lukasz", email = "lukasz.f24@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "httpx>=0.28.1",
    "python-dotenv>=1.2.3",
    "textual>=8.2.8",
]

[project.scripts]
pico = "pico.cli:main"

[build-system]
requires = ["uv_build>=0.12.15,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pyright>=1.1.414",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "pytest-cov>=7.1.0",
    "pytest-xdist>=3.8.0",
    "ruff>=0.16.7",
    "tach>=0.35.1",
    "vulture>=2.16",
]

[tool.ruff]
src = ["src", "tests"]
line-length = 100
target-version = "py313"
extend-exclude = ["vulture_whitelist.py"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
    "SIM", # flake8-simplify
    "C4",  # flake8-comprehensions
    "RUF", # ruff-specific
]

[tool.ruff.lint.isort]
known-first-party = ["pico"]

[tool.pyright]
include = ["src", "tests"]
venvPath = "."
venv = ".venv"
typeCheckingMode = "strict"
reportMissingTypeStubs = false

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-n auto --cov=pico --cov-report=term-missing"
asyncio_mode = "auto"
filterwarnings = ["error"]

[tool.coverage.run]
source = ["src/pico"]
branch = true

[tool.coverage.report]
skip_empty = true
precision = 1
fail_under = 94

[tool.vulture]
paths = ["src/pico", "vulture_whitelist.py"]
min_confidence = 60
sort_by_size = true
